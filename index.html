<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUCKY DRAW</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
  :root{
    --paper:#F6F4EC;
    --surface:#FFFFFF;
    --ink:#15161A;
    --ink-soft:#54565E;
    --line:#15161A;
    --pop-blue:#1E4FFF;
    --pop-red:#FF3B2F;
    --pop-yellow:#FFC72C;
    --pop-green:#00A66C;
    --pop-purple:#7C4DFF;
    --pop-orange:#FF7A1E;
    --good:#00A66C;
    --danger:#FF3B2F;
    --shadow-sm:3px 3px 0 var(--ink);
    --shadow-md:5px 5px 0 var(--ink);
    --font-display:'Libre Franklin',system-ui,sans-serif;
    --font-body:'Libre Franklin',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  /* Flat, hairline-and-flat-color look on purpose — no dark mode, no gradients. */
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    padding:20px 16px 40px;
    min-height:100vh;
  }
  ::selection{background:var(--pop-yellow);}
  .wrap{max-width:1180px;margin:0 auto;}

  /* ---- header ---- */
  .top{
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;font-weight:700;
    color:var(--pop-blue);text-transform:uppercase;
  }
  .brand h1{
    font-family:var(--font-display);font-weight:900;
    font-size:clamp(28px,5vw,40px);line-height:.95;margin:2px 0 0;
    letter-spacing:-.01em;text-wrap:balance;
  }
  .status-strip{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-family:var(--font-mono);font-size:12px;color:var(--ink);
  }
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--surface);border:2px solid var(--line);
    padding:5px 10px;border-radius:0;font-weight:600;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.2;flex:none;}
  .dot.on{background:var(--good);opacity:1;}
  .dot.shake{background:var(--pop-red);opacity:1;animation:pulse 0.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  @media (prefers-reduced-motion: reduce){.dot.shake{animation:none;}}

  /* ---- setup card ---- */
  .card{
    background:var(--surface);border:2.5px solid var(--line);
    border-radius:0;padding:22px;box-shadow:var(--shadow-md);
  }
  .setup{max-width:640px;margin:0 auto;}
  .setup h2{
    font-family:var(--font-display);font-weight:900;font-size:26px;margin:0 0 6px;letter-spacing:-.01em;
  }
  .setup p{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 18px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  @media (max-width:520px){.role-grid{grid-template-columns:1fr;}}
  .role-btn{
    background:var(--surface);border:2.5px solid var(--line);
    border-radius:0;padding:16px 14px;text-align:left;cursor:pointer;
    color:var(--ink);font-family:var(--font-body);
    box-shadow:var(--shadow-sm);
    transition:transform .08s,box-shadow .08s,background .1s;
  }
  .role-btn:hover{background:#FBFAF5;}
  .role-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
  .role-btn.selected{background:var(--pop-yellow);}
  .role-btn .r-icon{font-size:22px;}
  .role-btn .r-title{font-weight:800;font-size:15.5px;margin:8px 0 3px;}
  .role-btn .r-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .role-btn.selected .r-desc{color:var(--ink);}
  label.field-label{
    display:block;font-size:12px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;
  }
  textarea#rosterInput{
    width:100%;min-height:150px;resize:vertical;
    background:var(--paper);border:2.5px solid var(--line);border-radius:0;
    color:var(--ink);font-family:var(--font-mono);font-size:13.5px;line-height:1.65;
    padding:12px 14px;outline:none;
  }
  textarea#rosterInput:focus{background:var(--surface);}
  input#viewerCodeInput{
    width:100%;text-align:center;text-transform:uppercase;letter-spacing:.18em;
    background:var(--paper);border:2.5px solid var(--line);border-radius:0;
    color:var(--ink);font-family:var(--font-mono);font-size:22px;font-weight:700;
    padding:14px;outline:none;
  }
  input#viewerCodeInput:focus{background:var(--surface);}
  .setup-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap;}
  .count-readout{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-soft);}
  .count-readout b{color:var(--pop-blue);font-size:15px;}

  button{font-family:var(--font-body);cursor:pointer;}
  .btn{
    padding:12px 20px;border-radius:0;font-weight:800;font-size:14.5px;
    background:var(--surface);color:var(--ink);border:2.5px solid var(--line);
    box-shadow:var(--shadow-sm);
    transition:transform .08s,box-shadow .08s,background .1s;
  }
  .btn:hover{background:#FBFAF5;}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink);}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}
  .btn-primary{background:var(--pop-blue);color:#fff;}
  .btn-primary:hover{background:#1642DB;}
  .btn-ghost{background:var(--paper);box-shadow:none;}
  .btn-ghost:active{box-shadow:none;}
  .btn.flip-on{background:var(--pop-yellow);}
  .btn-danger{color:var(--danger);}

  /* ---- machine layout ---- */
  .layout{display:grid;grid-template-columns:1fr;gap:16px;}
  @media (min-width:860px){.layout{grid-template-columns:1fr 320px;align-items:start;}}

  .machine{
    background:var(--surface);border:2.5px solid var(--line);
    border-radius:0;padding:16px;box-shadow:var(--shadow-md);
  }
  .drum-frame{
    position:relative;border-radius:0;
    border:3px solid var(--line);
    overflow:hidden;
  }
  .drum-glass{
    position:relative;overflow:hidden;
    background-color:var(--paper);
    aspect-ratio:1000/650;
  }
  canvas#drum{width:100%;height:100%;display:block;position:relative;}
  .phase-readout{
    position:absolute;top:10px;left:10px;z-index:2;
    font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;font-weight:700;
    background:var(--ink);color:var(--paper);
    padding:5px 10px;border-radius:0;
  }

  .deck{margin-top:14px;display:flex;flex-direction:column;gap:12px;}
  .peer-code-row{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--paper);border:2px solid var(--line);padding:10px 12px;
    font-family:var(--font-mono);font-size:12.5px;
  }
  .peer-code-row .code-big{
    font-size:20px;font-weight:800;letter-spacing:.14em;color:var(--pop-blue);
  }
  .peer-code-row .btn{padding:6px 12px;font-size:11.5px;}
  .peer-code-row .hint{color:var(--ink-soft);}
  .shake-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  #shakeBtn{
    flex:1 1 200px;padding:18px 20px;font-size:16px;
    background:var(--pop-red);border:2.5px solid var(--line);
    color:#fff;border-radius:0;font-weight:800;letter-spacing:.01em;
    box-shadow:var(--shadow-md);
    user-select:none;-webkit-user-select:none;touch-action:none;
    transition:transform .08s,box-shadow .08s;
  }
  #shakeBtn.engaged{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  .meter{
    height:10px;border-radius:0;background:var(--paper);overflow:hidden;
    border:2px solid var(--line);flex:1 1 140px;
  }
  .meter > i{display:block;height:100%;width:0%;background:var(--pop-yellow);transition:width .08s linear;}
  .deck-controls{display:flex;gap:8px;flex-wrap:wrap;}
  .sensor-note{font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);}
  .debug-wrap{border:2px solid var(--line);background:var(--surface);}
  .debug-wrap + .debug-wrap{margin-top:12px;}
  .debug-legend{
    display:flex;align-items:center;gap:10px;padding:6px 8px;
    border-bottom:2px solid var(--line);
    font-family:var(--font-mono);font-size:14px;font-weight:700;
  }
  .debug-legend .sw{width:11px;height:11px;display:inline-block;margin-right:4px;border:1px solid var(--ink);vertical-align:-1px;}
  .debug-legend .debug-hint{margin-left:auto;color:var(--ink-soft);font-weight:500;}
  #debugGraph,#debugGraphAngle{display:block;width:100%;height:120px;}
  .viewer-note{
    text-align:center;color:var(--ink-soft);font-size:13.5px;
    padding:14px;font-family:var(--font-mono);
  }

  /* ---- sidebar ---- */
  .sidebar{display:flex;flex-direction:column;gap:16px;}
  .panel-title{
    font-family:var(--font-display);font-weight:800;font-size:17px;
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  }
  .panel-title span.n{font-family:var(--font-mono);font-weight:600;font-size:12px;color:var(--ink-soft);}
  .roster-list{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px;}
  .roster-row{
    display:flex;align-items:center;gap:8px;font-size:13px;
    padding:6px 8px;border-radius:0;background:var(--paper);border:1.5px solid var(--line);
  }
  .roster-row .swatch{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px solid var(--ink);}
  .roster-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .result-list{display:flex;flex-direction:column;gap:6px;}
  .result-row{
    display:flex;align-items:center;gap:10px;
    background:var(--paper);border:1.5px solid var(--line);border-radius:0;padding:8px 10px;
    opacity:0;transform:translateY(6px);
    animation:riseIn .35s ease forwards;
  }
  @media (prefers-reduced-motion: reduce){.result-row{animation:none;opacity:1;transform:none;}}
  @keyframes riseIn{to{opacity:1;transform:translateY(0);}}
  .result-row .rk{
    font-family:var(--font-mono);font-weight:700;color:var(--pop-blue);
    width:26px;text-align:right;font-variant-numeric:tabular-nums;
  }
  .result-row .swatch{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px solid var(--ink);}
  .result-row .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .empty-note{color:var(--ink-soft);font-size:12.5px;font-family:var(--font-mono);}
  #resultActions{display:flex;gap:8px;margin-top:10px;}
  #resultActions .btn{flex:1;padding:9px 12px;font-size:12.5px;}

  .hidden{display:none!important;}
  a.link-reset{color:var(--ink-soft);font-size:12px;text-decoration:underline;cursor:pointer;background:none;font-family:var(--font-mono);}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <span class="eyebrow">SHAKE &amp; DRAW</span>
      <h1>LUCKY DRAW</h1>
    </div>
    <div class="status-strip">
      <span class="pill"><i class="dot" id="dotController"></i>컨트롤러 <span id="cntController">0</span></span>
      <span class="pill"><i class="dot" id="dotViewer"></i>관전자 <span id="cntViewer">0</span></span>
      <span class="pill" id="roleTag">역할: 미선택</span>
    </div>
  </div>

  <!-- SETUP -->
  <section class="card setup" id="setupCard">
    <h2>명단을 넣고 흔들 준비를 하세요</h2>

    <div class="role-grid">
      <button class="role-btn" id="pickController" type="button">
        <div class="r-icon">📱</div>
        <div class="r-title">흔들기 담당</div>
      </button>
      <button class="role-btn" id="pickViewer" type="button">
        <div class="r-icon">🖥️</div>
        <div class="r-title">관전만 하기</div>
      </button>
    </div>

    <div id="controllerSetupFields">
      <label class="field-label" for="rosterInput">참가자 명단</label>
      <textarea id="rosterInput" placeholder="예시)&#10;김민준&#10;이서연&#10;박도윤&#10;최하은&#10;..."></textarea>
      <div class="setup-foot">
        <span class="count-readout">인식된 인원: <b id="rosterCount">0</b>명</span>
        <button class="btn btn-primary" id="startBtn" disabled>저장하고 시작</button>
      </div>
    </div>

    <div id="viewerSetupFields" class="hidden">
      <label class="field-label" for="viewerCodeInput">흔들기 담당 기기의 연결 코드</label>
      <input id="viewerCodeInput" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="예: 7F3KQ">
      <div class="setup-foot">
        <span class="count-readout" id="viewerConnectStatus">폰 화면에 뜬 5자리 코드를 입력하세요</span>
        <button class="btn btn-primary" id="viewerConnectBtn" type="button">연결하기</button>
      </div>
    </div>
  </section>

  <!-- MACHINE -->
  <section class="layout hidden" id="machineLayout">
    <div class="machine">
      <div class="drum-frame">
        <div class="drum-glass">
          <canvas id="drum"></canvas>
          <div class="phase-readout" id="phaseReadout">대기중</div>
        </div>
      </div>

      <div class="deck" id="controllerDeck">
        <div class="peer-code-row">
          <span>연결 코드</span>
          <span class="code-big" id="peerCodeText">생성 중…</span>
          <button class="btn btn-ghost" id="copyCodeBtn" type="button">코드 복사</button>
        </div>
        <div class="shake-row">
          <button id="shakeBtn">탭해서 자이로 켜기</button>
          <div class="meter"><i id="meterFill"></i></div>
        </div>
        <div class="deck-controls">
          <button class="btn" id="reshuffleBtn">다시 흔들기</button>
          <button class="btn" id="newRoundBtn">새 라운드</button>
          <button class="btn btn-ghost" id="editRosterBtn">명단 변경</button>
        </div>
        <div class="sensor-note" id="sensorNote">자이로 센서: 확인 중…</div>
        <div class="deck-controls">
          <button class="btn btn-ghost" id="flipXBtn" type="button">X 반전</button>
          <button class="btn btn-ghost" id="flipYBtn" type="button">Y 반전</button>
          <button class="btn btn-ghost" id="flipZBtn" type="button">Z 반전</button>
        </div>
      </div>

      <div class="viewer-note hidden" id="viewerNote">관전 모드</div>

      <!-- shared by both roles: controller draws these from its own live sensor
           readings, viewer draws the same graphs from readings received over
           the peer connection (see broadcastTick/onRoomTick) -->
      <div class="debug-wrap">
        <div class="debug-legend">
          <span><i class="sw" style="background:#FF3B2F"></i>X</span>
          <span><i class="sw" style="background:#1E4FFF"></i>Y</span>
          <span><i class="sw" style="background:#00A66C"></i>Z</span>
        </div>
        <canvas id="debugGraph" height="120"></canvas>
      </div>
      <div class="debug-wrap">
        <div class="debug-legend">
          <span><i class="sw" style="background:#7C4DFF"></i>ROLL</span>
          <span><i class="sw" style="background:#FF7A1E"></i>PITCH</span>
          <span><i class="sw" style="background:#00AEEF"></i>YAW</span>
        </div>
        <canvas id="debugGraphAngle" height="120"></canvas>
      </div>
    </div>

    <aside class="sidebar">
      <div class="card">
        <div class="panel-title">참가 명단 <span class="n" id="rosterPanelCount">0명</span></div>
        <div class="roster-list" id="rosterList"></div>
      </div>
      <div class="card">
        <div class="panel-title">결과 <span class="n" id="resultPanelState">대기중</span></div>
        <div class="result-list" id="resultList">
          <div class="empty-note">흔들기가 멈추면 여기에 순위가 표시돼요.</div>
        </div>
        <div id="resultActions" class="hidden">
          <button class="btn" id="copyResultBtn">순위 복사</button>
        </div>
      </div>
      <button class="link-reset" id="fullResetBtn">전체 초기화</button>
    </aside>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
(function(){
  "use strict";

  /* ============================= constants =============================
     Real 3D rewrite: Cannon.js (physics) + Three.js (WebGL rendering)
     replace Matter.js + Canvas2D. The box is a genuine 3D volume — X
     (left/right), Y (up/down, Cannon/Three convention: up is positive),
     Z (front/back — positive Z is toward the camera / front glass,
     negative Z is the back wall). Device motion x/y/z map 1:1 onto these
     world axes (see the sensor section below), so tilt/shake response is
     symmetric across all three axes instead of Z being a fake spring hack. */
  var BOX_W = 10, BOX_H = 6.6, BOX_D = 6.2; // physics + render world units (meters-ish)
  var TICK_MS = 70;          // broadcast interval to viewers while a round is live
  var SHAKE_ON = 7;          // m/s^2 deviation to count as "shaking"
  var SHAKE_OFF_HOLD = 650;  // ms below threshold before we call it "stopped"
  var SETTLE_SPEED = 0.15;   // cannon body.velocity length (units/s) considered "at rest"
  var SETTLE_HOLD = 550;     // ms all bodies must stay under SETTLE_SPEED
  var SETTLE_TIMEOUT = 7000; // hard cap so a round can't hang forever
  var PEER_ID_PREFIX = "luckydrum7f3-"; // namespaces our ids on the public PeerJS broker

  var HANGUL_RE = /[ㄱ-힝]/;
  var NUMERIC_RE = /^[0-9]+$/;

  /* ============================= dom refs ============================= */
  var $ = function(id){ return document.getElementById(id); };
  var setupCard = $("setupCard"), machineLayout = $("machineLayout");
  var controllerSetupFields = $("controllerSetupFields"), viewerSetupFields = $("viewerSetupFields");
  var rosterInput = $("rosterInput"), rosterCount = $("rosterCount"), startBtn = $("startBtn");
  var viewerCodeInput = $("viewerCodeInput"), viewerConnectBtn = $("viewerConnectBtn"), viewerConnectStatus = $("viewerConnectStatus");
  var pickController = $("pickController"), pickViewer = $("pickViewer");
  var controllerDeck = $("controllerDeck"), viewerNote = $("viewerNote");
  var shakeBtn = $("shakeBtn"), meterFill = $("meterFill"), sensorNote = $("sensorNote");
  var flipXBtn = $("flipXBtn"), flipYBtn = $("flipYBtn"), flipZBtn = $("flipZBtn");
  var reshuffleBtn = $("reshuffleBtn"), newRoundBtn = $("newRoundBtn"), editRosterBtn = $("editRosterBtn");
  var fullResetBtn = $("fullResetBtn");
  var phaseReadout = $("phaseReadout"), roleTag = $("roleTag");
  var rosterList = $("rosterList"), rosterPanelCount = $("rosterPanelCount");
  var resultList = $("resultList"), resultPanelState = $("resultPanelState"), resultActions = $("resultActions");
  var copyResultBtn = $("copyResultBtn");
  var dotController = $("dotController"), dotViewer = $("dotViewer");
  var cntController = $("cntController"), cntViewer = $("cntViewer");
  var peerCodeText = $("peerCodeText"), copyCodeBtn = $("copyCodeBtn");
  var canvas = $("drum"); // WebGL surface — owned by the Three.js renderer (see ensureScene3D), no 2d context here
  var debugCanvas = $("debugGraph");
  var debugCtx = debugCanvas.getContext("2d");
  var angleCanvas = $("debugGraphAngle");
  var angleCtx = angleCanvas.getContext("2d");

  var PHASE_LABEL = {idle:"대기중", ready:"준비됨 · 흔들어보세요", shaking:"흔드는 중", settling:"멈추는 중", done:"완료"};

  /* ============================= state ============================= */
  var role = null;          // 'controller' | 'viewer'
  var roster = [];          // string[]
  var phase = "idle";
  var roundId = 0;
  var balls = [];           // render mirrors: {x,y,a,r,color,label}
  var lastTickAt = 0, prevSnap = null, curSnap = null; // for viewer interpolation

  /* ============================= peerjs sync layer ============================= */
  // Standalone build: no Claude Artifact db/room capabilities are available here,
  // so phone<->laptop sync runs over WebRTC via PeerJS's free public signaling
  // broker (no account/signup, no server of our own). The controller ("host")
  // opens a Peer under a short human-readable code; each viewer opens its own
  // throwaway Peer and connects directly to that code. Once a DataConnection is
  // open the host pushes a full state snapshot immediately (covers late joiners),
  // then streams the same tick/event messages the physics loop already produces.
  var peer = null;            // this device's own Peer object (host or viewer)
  var viewerConns = [];       // host only: open DataConnections to each viewer
  var hostConn = null;        // viewer only: the DataConnection to the controller
  var peerCode = null;        // host only: the short code viewers type in

  function randomCode(len){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no 0/O/1/I — easy to read aloud
    var s = "";
    for (var i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }

  function updatePeerStatusUI(){
    if (role === "controller"){
      dotController.classList.add("on");
      cntController.textContent = "1";
      var vCount = viewerConns.filter(function(c){ return c.open; }).length;
      cntViewer.textContent = String(vCount);
      dotViewer.classList.toggle("on", vCount > 0);
    }
  }

  function initHostPeer(){
    if (peer) return; // already hosting — keep the same code across "새 라운드"/roster edits
    peerCode = randomCode(5);
    peer = new Peer(PEER_ID_PREFIX + peerCode, { debug: 1 });
    peer.on("open", function(){
      peerCodeText.textContent = peerCode;
      updatePeerStatusUI();
    });
    peer.on("connection", function(conn){
      viewerConns.push(conn);
      conn.on("open", function(){
        updatePeerStatusUI();
        sendFullStateTo(conn);
      });
      conn.on("close", function(){
        viewerConns = viewerConns.filter(function(c){ return c !== conn; });
        updatePeerStatusUI();
      });
      conn.on("error", function(){});
    });
    peer.on("error", function(err){
      peerCodeText.textContent = "오류";
      sensorNote.textContent = "연결 오류: " + (err && err.type ? err.type : String(err));
    });
  }

  function viewerConnect(rawCode){
    var code = (rawCode || "").trim().toUpperCase();
    if (!code){ viewerConnectStatus.textContent = "코드를 입력하세요"; return; }
    if (peer){ peer.destroy(); peer = null; }
    hostConn = null;
    viewerConnectStatus.textContent = "연결 중…";
    viewerConnectBtn.disabled = true;
    peer = new Peer(PEER_ID_PREFIX + "v" + Math.random().toString(36).slice(2,8), { debug: 1 });
    peer.on("open", function(){
      hostConn = peer.connect(PEER_ID_PREFIX + code, { reliable: true });
      hostConn.on("open", function(){
        viewerConnectStatus.textContent = "연결됨 · 실시간 수신 중";
        viewerConnectBtn.disabled = false;
        dotController.classList.add("on");
        cntController.textContent = "1";
        dotViewer.classList.add("on");
        cntViewer.textContent = "1";
      });
      hostConn.on("data", handlePeerMessage);
      hostConn.on("close", function(){
        viewerConnectStatus.textContent = "연결이 끊겼어요 · 다시 연결해보세요";
        viewerConnectBtn.disabled = false;
        dotController.classList.remove("on");
        cntController.textContent = "0";
      });
      hostConn.on("error", function(){
        viewerConnectStatus.textContent = "연결 실패 · 코드를 확인하세요";
        viewerConnectBtn.disabled = false;
      });
    });
    peer.on("error", function(err){
      viewerConnectStatus.textContent = "연결 실패 · 코드를 확인하세요 (" + (err && err.type ? err.type : "오류") + ")";
      viewerConnectBtn.disabled = false;
    });
  }

  function broadcastToViewers(msg){
    viewerConns.forEach(function(c){ if (c.open) c.send(msg); });
  }
  function broadcastTick(){
    if (!viewerConns.length) return;
    // 3D positions only (x,y,z) — no rotation is synced. Ball rotation isn't
    // simulated visually at all (see ensureBallMeshPool/render3D below): labels
    // are camera-facing sprites rather than textures baked onto the spinning
    // sphere, so host and viewer stay pixel-identical without needing quaternion
    // data on the wire.
    var payload = balls.map(function(b){ return [Math.round(b.x*100)/100, Math.round(b.y*100)/100, Math.round(b.z*100)/100]; });
    // g: the same fast-smoothed accelerometer reading (smGx/y/z) the controller's
    // own debug graph plots — sent along so every viewer's copy of that graph
    // shows the live IMU signal too, not just the ball positions.
    var gPayload = [Math.round(smGx*100)/100, Math.round(smGy*100)/100, Math.round(smGz*100)/100];
    // a: the same smoothed roll/pitch/yaw (deviceorientation) reading the
    // controller's own angle graph plots — piggybacked the same way g is.
    var aPayload = [Math.round(smRoll*100)/100, Math.round(smPitch*100)/100, Math.round(smYaw*100)/100];
    broadcastToViewers({ kind:"tick", roundId: roundId, phase: phase, b: payload, g: gPayload, a: aPayload });
  }
  function broadcastEvent(type, data){
    data = data || {};
    data.kind = "event";
    data.type = type;
    broadcastToViewers(data);
  }
  function sendFullStateTo(conn){
    conn.send({
      kind: "full",
      roster: roster, phase: phase, roundId: roundId,
      balls: balls.map(function(b){ return [Math.round(b.x*100)/100, Math.round(b.y*100)/100, Math.round(b.z*100)/100]; }),
      ranking: lastRanking
    });
  }

  function handlePeerMessage(msg){
    if (!msg || role === "controller") return;
    if (msg.kind === "tick") onRoomTick(msg);
    else if (msg.kind === "event") onRoomEvent(msg);
    else if (msg.kind === "full") applyFullState(msg);
  }

  function onRoomTick(msg){
    if (!msg) return;
    if (msg.roundId) roundId = msg.roundId;
    prevSnap = curSnap;
    curSnap = { t: performance.now(), b: msg.b };
    if (msg.phase) setPhase(msg.phase, true);
    // feeds the SAME debug graph / ring buffer the controller's own onDeviceMotion
    // feeds — so a viewer's graph is the controller's real IMU signal, not a copy.
    // The controller pushes one point per real sensor event (~60Hz); a viewer
    // only gets one g reading per network tick (~TICK_MS, ~14Hz), so pushing
    // just that one point per tick packs far fewer, much bigger jumps into the
    // same 160-point window — that's what was reading as "spiky" compared to
    // the phone's own smooth trace. Interpolating a few points between the
    // last received reading and this one fills that gap with the same values
    // the real signal was already moving through, so the shape matches.
    if (Array.isArray(msg.g)){
      var g = msg.g;
      if (lastViewerG){
        var STEPS = 5;
        for (var s=1; s<=STEPS; s++){
          var t = s/STEPS;
          pushDebugSample(
            lastViewerG[0] + (g[0]-lastViewerG[0])*t,
            lastViewerG[1] + (g[1]-lastViewerG[1])*t,
            lastViewerG[2] + (g[2]-lastViewerG[2])*t
          );
        }
      } else {
        pushDebugSample(g[0]||0, g[1]||0, g[2]||0);
      }
      lastViewerG = g;
    }
    // Same interpolation treatment for roll/pitch/yaw. Yaw specifically can
    // wrap across the -180/180 boundary between two ticks (e.g. 179 -> -179
    // is really just a 2-degree turn) — interpolating that difference
    // directly would swing the graph the long way around, so the yaw delta
    // is wrapped into [-180,180] before interpolating.
    if (Array.isArray(msg.a)){
      var a = msg.a;
      if (lastViewerA){
        var ASTEPS = 5;
        var yawDelta = a[2] - lastViewerA[2];
        yawDelta = ((yawDelta + 180) % 360 + 360) % 360 - 180;
        for (var as = 1; as <= ASTEPS; as++){
          var at = as/ASTEPS;
          pushAngleSample(
            lastViewerA[0] + (a[0]-lastViewerA[0])*at,
            lastViewerA[1] + (a[1]-lastViewerA[1])*at,
            lastViewerA[2] + yawDelta*at
          );
        }
      } else {
        pushAngleSample(a[0]||0, a[1]||0, a[2]||0);
      }
      lastViewerA = a;
    }
  }
  var lastViewerG = null;
  var lastViewerA = null;

  function onRoomEvent(msg){
    if (!msg) return;
    if (msg.type === "init"){
      roster = msg.roster || roster;
      roundId = msg.roundId;
      renderRosterList();
      resultActions.classList.add("hidden");
      resultList.innerHTML = '<div class="empty-note">흔들기가 멈추면 여기에 순위가 표시돼요.</div>';
      resultPanelState.textContent = "대기중";
      setPhase("ready", true);
      prevSnap = curSnap = null;
      if (setupCard.classList.contains("hidden") === false) enterMachine();
      ensureScene3D();
      ensureBallMeshPool(roster.length);
    } else if (msg.type === "result"){
      if (msg.roundId === roundId) showResult(msg.ranking, true);
    } else if (msg.type === "reset"){
      roster = []; roundId = 0;
      machineLayout.classList.add("hidden");
      setupCard.classList.remove("hidden");
    }
  }

  function applyFullState(msg){
    if (!msg) return;
    if (Array.isArray(msg.roster) && msg.roster.length){
      roster = msg.roster.slice();
      renderRosterList();
    }
    if (msg.roundId) roundId = msg.roundId;
    ensureScene3D();
    ensureBallMeshPool(roster.length);
    if (Array.isArray(msg.balls)) applySnapshotBalls(msg.balls);
    setPhase(msg.phase || "idle", true);
    if (msg.phase === "done" && Array.isArray(msg.ranking)) showResult(msg.ranking, true);
    prevSnap = curSnap = null;
    if (setupCard.classList.contains("hidden") === false && roster.length) enterMachine();
  }

  function applySnapshotBalls(pairs){
    balls = pairs.map(function(p, i){
      return { x:p[0], y:p[1], z:p[2]||0, color: colorFor(i), textColor: textColorFor(i), label: labelFor(roster[i]||"") };
    });
  }

  /* ============================= roster parsing ============================= */
  function parseRoster(text){
    return text.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
  }
  function updateRosterCount(){
    var n = parseRoster(rosterInput.value).length;
    rosterCount.textContent = n;
    startBtn.disabled = n < 2;
  }
  rosterInput.addEventListener("input", updateRosterCount);
  viewerCodeInput.addEventListener("input", function(){
    var v = viewerCodeInput.value.toUpperCase();
    viewerCodeInput.value = v;
  });

  var BALL_PALETTE = [
    {bg:"#FF3B2F", tx:"#FFFFFF"}, {bg:"#1E4FFF", tx:"#FFFFFF"},
    {bg:"#FFC72C", tx:"#15161A"}, {bg:"#00A66C", tx:"#FFFFFF"},
    {bg:"#7C4DFF", tx:"#FFFFFF"}, {bg:"#FF7A1E", tx:"#15161A"},
    {bg:"#00AEEF", tx:"#15161A"}, {bg:"#FF4FA3", tx:"#15161A"}
  ];
  function colorFor(i){ return BALL_PALETTE[i % BALL_PALETTE.length].bg; }
  function textColorFor(i){ return BALL_PALETTE[i % BALL_PALETTE.length].tx; }
  function labelFor(name){
    if (NUMERIC_RE.test(name)) return name.slice(0,4);
    if (HANGUL_RE.test(name)) return name.slice(0,2);
    return name.slice(0,3).toUpperCase();
  }
  function radiusFor(n){
    var volPerBall = 0.30 * (BOX_W*BOX_H*BOX_D) / Math.max(n,1);
    var r = Math.cbrt(volPerBall / ((4/3)*Math.PI));
    return Math.max(0.28, Math.min(1.05, r));
  }

  function renderRosterList(){
    rosterPanelCount.textContent = roster.length + "명";
    rosterList.innerHTML = "";
    roster.forEach(function(name, i){
      var row = document.createElement("div");
      row.className = "roster-row";
      var sw = document.createElement("span");
      sw.className = "swatch"; sw.style.background = colorFor(i, roster.length);
      var nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = name;
      row.appendChild(sw); row.appendChild(nm);
      rosterList.appendChild(row);
    });
  }

  /* ============================= role selection ============================= */
  pickController.addEventListener("click", function(){ selectRole("controller"); });
  pickViewer.addEventListener("click", function(){ selectRole("viewer"); });

  function selectRole(r){
    role = r;
    pickController.classList.toggle("selected", r === "controller");
    pickViewer.classList.toggle("selected", r === "viewer");
    roleTag.textContent = "역할: " + (r === "controller" ? "흔들기 담당" : "관전");
    controllerSetupFields.classList.toggle("hidden", r === "viewer");
    viewerSetupFields.classList.toggle("hidden", r !== "viewer");
  }

  startBtn.addEventListener("click", function(){
    var list = parseRoster(rosterInput.value);
    if (list.length < 2) return;
    if (!role) selectRole("controller");
    roster = list;
    renderRosterList();
    roundId = Date.now();
    enterMachine();
    if (role === "controller"){
      buildWorld();
      setPhase("ready");
      initHostPeer();
      broadcastEvent("init", { roster: roster, roundId: roundId });
    }
  });

  viewerConnectBtn.addEventListener("click", function(){
    if (!role) selectRole("viewer");
    viewerConnect(viewerCodeInput.value);
  });

  function enterMachine(){
    setupCard.classList.add("hidden");
    machineLayout.classList.remove("hidden");
    controllerDeck.classList.toggle("hidden", role !== "controller");
    viewerNote.classList.toggle("hidden", role === "controller");
    ensureScene3D();
    resizeCanvas();
    if (role === "controller") setupSensors();
    else { dotViewer.classList.add("on"); cntViewer.textContent = "1"; }
    // iOS's own "Shake to Undo" feature watches for device shaking right after any
    // recent text edit and pops up its system alert — it's what was interrupting
    // shaking here. Dropping focus out of the roster textarea removes the most
    // obvious trigger for it; the rest is an iOS setting (see sensor note below).
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  editRosterBtn.addEventListener("click", function(){
    machineLayout.classList.add("hidden");
    setupCard.classList.remove("hidden");
  });

  copyCodeBtn.addEventListener("click", function(){
    if (!peerCode) return;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(peerCode).then(function(){
        copyCodeBtn.textContent = "복사됨!";
        setTimeout(function(){ copyCodeBtn.textContent = "코드 복사"; }, 1400);
      }).catch(function(){});
    }
  });

  fullResetBtn.addEventListener("click", function(){
    if (!confirm("명단과 결과를 모두 초기화할까요?")) return;
    roster = []; balls = []; lastRanking = null; roundId = 0;
    disposeBallMeshPool();
    rosterInput.value = ""; updateRosterCount();
    setPhase("idle");
    machineLayout.classList.add("hidden");
    setupCard.classList.remove("hidden");
    broadcastEvent("reset", { roundId: 0 });
    if (peer){ peer.destroy(); peer = null; }
    if (hostConn){ hostConn.close(); hostConn = null; }
    viewerConns = []; peerCode = null;
    peerCodeText.textContent = "생성 중…";
    dotController.classList.remove("on","shake");
    dotViewer.classList.remove("on");
    cntController.textContent = "0"; cntViewer.textContent = "0";
  });

  /* ============================= canvas sizing ============================= */
  function resizeCanvas(){
    var dpr = window.devicePixelRatio || 1;
    if (renderer3D && camera3D){
      var rect = canvas.getBoundingClientRect();
      if (rect.width && rect.height){
        renderer3D.setSize(rect.width, rect.height, false);
        camera3D.aspect = rect.width / rect.height;
        camera3D.updateProjectionMatrix();
      }
    }
    var GRAPH_H = 120;
    var drect = debugCanvas.getBoundingClientRect();
    if (drect.width){
      debugCanvas.width = Math.round(drect.width * dpr);
      debugCanvas.height = Math.round(GRAPH_H * dpr);
    }
    var arect = angleCanvas.getBoundingClientRect();
    if (arect.width){
      angleCanvas.width = Math.round(arect.width * dpr);
      angleCanvas.height = Math.round(GRAPH_H * dpr);
    }
  }
  window.addEventListener("resize", resizeCanvas);

  // Shared by both live strips (raw accel X/Y/Z and roll/pitch/yaw angle) —
  // same drawing logic, different canvas/buffer/range/colors.
  //
  // Renders each series as a smooth curve rather than straight lineTo()
  // segments corner-to-corner between points: a viewer's line was still
  // reading as jagged even after the earlier interpolation fix, because
  // subdividing a straight segment with more collinear points doesn't curve
  // it — only the segment's actual shape does. A quadratic through each
  // pair's midpoint rounds every corner into a curve, which is what the
  // phone's own graph effectively looks like once you have enough
  // close-together points that each straight segment's angle is tiny.
  function drawGraphStrip(cv, cx, series, range, lastSampleAt){
    var w = cv.width, h = cv.height;
    if (!w || !h) return;
    cx.clearRect(0,0,w,h);
    cx.fillStyle = "#FFFFFF";
    cx.fillRect(0,0,w,h);
    var midY = h/2;
    cx.strokeStyle = "rgba(21,22,26,.25)";
    cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(0, midY); cx.lineTo(w, midY); cx.stroke();
    var lineScale = (role === "controller") ? 1 : 0.8; // observer line drawn thinner on request
    series.forEach(function(s){
      var arr = s.arr;
      if (arr.length < 2) return;
      cx.strokeStyle = s.color;
      cx.lineWidth = Math.max(1.2, w/DEBUG_BUF_LEN*0.9) * lineScale;
      cx.lineJoin = "round";
      cx.lineCap = "round";
      var pts = arr.map(function(v,i){ return { x:(i/(DEBUG_BUF_LEN-1))*w, y: midY - (v/range)*midY }; });
      cx.beginPath();
      cx.moveTo(pts[0].x, pts[0].y);
      for (var i=1;i<pts.length-1;i++){
        var mx = (pts[i].x+pts[i+1].x)/2, my = (pts[i].y+pts[i+1].y)/2;
        cx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
      }
      var last = pts[pts.length-1];
      cx.lineTo(last.x, last.y);
      cx.stroke();
    });
    // stale indicator: if no fresh sample recently — real sensor events on the
    // controller, or ticks received over the peer connection on a viewer —
    // say so right on the graph, for either role.
    if (lastSampleAt && performance.now() - lastSampleAt > 500){
      cx.fillStyle = "#FF3B2F";
      cx.font = "700 " + Math.max(10, h*0.13) + "px 'JetBrains Mono', monospace";
      cx.fillText("신호 끊김", 6, 14);
    }
  }
  function drawDebugGraph(){
    drawGraphStrip(debugCanvas, debugCtx, [
      { arr: debugBuf.ax, color: "#FF3B2F" },
      { arr: debugBuf.ay, color: "#1E4FFF" },
      { arr: debugBuf.az, color: "#00A66C" }
    ], 40, lastGraphSampleAt);
  }
  function drawAngleGraph(){
    drawGraphStrip(angleCanvas, angleCtx, [
      { arr: angleBuf.roll, color: "#7C4DFF" },
      { arr: angleBuf.pitch, color: "#FF7A1E" },
      { arr: angleBuf.yaw, color: "#00AEEF" }
    ], 180, lastAngleSampleAt);
  }

  /* ============================= three.js scene (both roles) ============================= */
  // Both the controller AND every viewer build the exact same 3D scene (same
  // box, same lights, same camera) — a viewer just feeds it positions received
  // over the wire instead of a local physics world. That's what guarantees the
  // spectator sees a pixel-identical picture instead of an approximation.
  var scene3D = null, camera3D = null, renderer3D = null, dirLight3D = null;
  var ballMeshPool = [];
  var SPHERE_GEO_CACHE = {}, OUTLINE_GEO_CACHE = {}, BALL_MAT_CACHE = {}, OUTLINE_MAT = null;

  function ensureScene3D(){
    if (scene3D) { resizeCanvas(); return; }
    if (typeof THREE === "undefined"){
      sensorNote.textContent = "3D 렌더러(Three.js)를 불러오지 못했어요 — 인터넷 연결을 확인하고 새로고침 해보세요.";
      return;
    }
    scene3D = new THREE.Scene();
    scene3D.background = new THREE.Color(0xF6F4EC); // --paper

    camera3D = new THREE.PerspectiveCamera(42, 1, 0.05, 100);
    camera3D.position.set(0, BOX_H*0.74, BOX_D*2.05);
    camera3D.lookAt(0, BOX_H*0.36, 0);

    renderer3D = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer3D.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer3D.shadowMap.enabled = true;
    renderer3D.shadowMap.type = THREE.PCFShadowMap; // crisper edges than soft PCF — matches the flat, hairline design

    // Lower ambient / brighter directional than a "flat" scene would use — a
    // matte, evenly-lit ball reads as soft foam; a sharp directional highlight
    // against darker shading is what makes a sphere look like a hard, dense
    // object instead.
    scene3D.add(new THREE.AmbientLight(0xffffff, 0.42));
    dirLight3D = new THREE.DirectionalLight(0xffffff, 1.15);
    dirLight3D.position.set(BOX_W*0.35, BOX_H*2.4, BOX_D*1.15);
    dirLight3D.target.position.set(0, BOX_H*0.25, 0);
    dirLight3D.castShadow = true;
    dirLight3D.shadow.mapSize.width = 1024;
    dirLight3D.shadow.mapSize.height = 1024;
    dirLight3D.shadow.camera.left = -BOX_W*0.9; dirLight3D.shadow.camera.right = BOX_W*0.9;
    dirLight3D.shadow.camera.top = BOX_D*0.9; dirLight3D.shadow.camera.bottom = -BOX_D*0.9;
    dirLight3D.shadow.camera.near = 0.5; dirLight3D.shadow.camera.far = BOX_H*6;
    dirLight3D.shadow.bias = -0.003;
    scene3D.add(dirLight3D); scene3D.add(dirLight3D.target);

    var floor = new THREE.Mesh(
      new THREE.PlaneGeometry(BOX_W, BOX_D),
      new THREE.MeshStandardMaterial({ color:0xF6F4EC, roughness:1, metalness:0 })
    );
    floor.rotation.x = -Math.PI/2;
    floor.receiveShadow = true;
    scene3D.add(floor);

    var back = new THREE.Mesh(
      new THREE.PlaneGeometry(BOX_W, BOX_H),
      new THREE.MeshStandardMaterial({ color:0xEFEBDD, roughness:1, metalness:0 })
    );
    back.position.set(0, BOX_H/2, -BOX_D/2);
    back.receiveShadow = true;
    scene3D.add(back);

    // Flat black hairline box edges — the real 3D box, so the shadow it casts
    // onto the floor/back wall is geometrically guaranteed to line up with it
    // (this is precisely what the fake-2.5D wireframe could never guarantee).
    var edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(BOX_W, BOX_H, BOX_D)),
      new THREE.LineBasicMaterial({ color: 0x15161A })
    );
    edges.position.set(0, BOX_H/2, 0);
    scene3D.add(edges);

    OUTLINE_MAT = new THREE.MeshBasicMaterial({ color: 0x15161A, side: THREE.BackSide });

    resizeCanvas();
  }

  function getSphereGeo(r){
    var k = Math.round(r*1000);
    if (!SPHERE_GEO_CACHE[k]) SPHERE_GEO_CACHE[k] = new THREE.SphereGeometry(r, 20, 16);
    return SPHERE_GEO_CACHE[k];
  }
  function getOutlineGeo(r){
    var k = Math.round(r*1000);
    if (!OUTLINE_GEO_CACHE[k]) OUTLINE_GEO_CACHE[k] = new THREE.SphereGeometry(r*1.06, 14, 10);
    return OUTLINE_GEO_CACHE[k];
  }
  // Low roughness + a touch of metalness is what separates a hard, glossy
  // billiard ball from a matte styrofoam one visually — a fully matte sphere
  // (roughness ~1) looks soft and foam-like under any lighting, regardless of
  // how the physics underneath actually behaves.
  function getBallMat(hex){
    if (!BALL_MAT_CACHE[hex]) BALL_MAT_CACHE[hex] = new THREE.MeshStandardMaterial({ color: hex, roughness: 0.22, metalness: 0.12 });
    return BALL_MAT_CACHE[hex];
  }
  // Labels are camera-facing sprites, not a texture wrapped around the (freely
  // tumbling) sphere — that decouples "does the ball look right" from "is the
  // label readable", and means we never need to sync rotation over the wire.
  function makeLabelSprite(text, textColor){
    var cv = document.createElement("canvas");
    cv.width = 128; cv.height = 128;
    var c = cv.getContext("2d");
    c.fillStyle = textColor || "#15161A";
    c.font = "700 44px 'JetBrains Mono', monospace";
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(text, 64, 68);
    var tex = new THREE.CanvasTexture(cv);
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });

      lastDebugPaint = now;
      var gTxt = world ? (world.gravity.x.toFixed(2) + ", " + world.gravity.y.toFixed(2) + ", " + world.gravity.z.toFixed(2)) : "-";
      sensorNote.textContent = "자이로: 연결됨 · 이벤트 " + motionEventCount +
        "개 · 편차 " + mag.toFixed(1) + " · g(" + smGx.toFixed(1) + ", " + smGy.toFixed(1) + ", " + smGz.toFixed(1) + ") · 적용중력(" + gTxt + ")";
    }
  }

  /* ============================= physics tick loop (controller) ============================= */
  var lastFrame = 0;
  function controllerLoop(ts){
    if (!lastFrame) lastFrame = ts;
    var dt = Math.min(34, ts - lastFrame);
    lastFrame = ts;
    requestAnimationFrame(controllerLoop);
    if (role !== "controller" || !world) return;

    if (fallbackHold && !sensorActive){ registerIntensity(18); }

    updateGravityFromSensor(); // follows slow phone orientation — see comment above the function

    if (phase === "shaking"){
      applyShakeAgitation(dt/16.67); // strong independent per-ball scatter — see comment above the function
      if (belowSinceAt && performance.now() - belowSinceAt > SHAKE_OFF_HOLD){
        setPhase("settling");
        settleQuietSinceAt = 0;
      }
    }

    world.step(1/60, Math.min(0.034, dt/1000), 8); // more substeps — needed for the stiffer billiard-ball contacts and higher top speed to stay stable
    capBallMotion();
    balls = composeBalls();

    if (phase === "settling"){
      var maxSpeed = 0;
      ballBodies.forEach(function(b){ maxSpeed = Math.max(maxSpeed, b.velocity.length()); });
      var quiet = maxSpeed < SETTLE_SPEED;
      if (quiet){
        if (!settleQuietSinceAt) settleQuietSinceAt = performance.now();
        if (performance.now() - settleQuietSinceAt > SETTLE_HOLD) finishRound();
      } else {
        settleQuietSinceAt = 0;
      }
      if (!settleStartedAt) settleStartedAt = performance.now();
      if (performance.now() - settleStartedAt > SETTLE_TIMEOUT) finishRound();
    } else {
      settleStartedAt = 0;
    }

    render3D();
    drawDebugGraph();
    drawAngleGraph();

    tickAccum += dt;
    if (tickAccum > TICK_MS && (phase==="shaking" || phase==="settling" || phase==="ready" || phase==="done")){
      tickAccum = 0;
      broadcastTick();
    }
  }
  var settleStartedAt = 0, tickAccum = 0;

  // Full lineup ranking (전체 줄세우기): where a ball finally rests along the
  // box's left-right (X) axis — the axis the camera/viewer actually sees —
  // decides its place in line, left to right.
  function finishRound(){
    var ranked = ballBodies.slice().sort(function(a,b){
      return a.position.x - b.position.x;
    }).map(function(b){ return b.appData.name; });
    lastRanking = ranked;
    setPhase("done");
    showResult(ranked, true);
    broadcastEvent("result", { roundId: roundId, ranking: ranked });
  }

  reshuffleBtn.addEventListener("click", function(){
    if (!world) return;
    ballBodies.forEach(function(b){
      b.velocity.set((Math.random()-0.5)*16, Math.random()*10+4, (Math.random()-0.5)*16);
    });
    lastRanking = null;
    resultActions.classList.add("hidden");
    setPhase("shaking");
    registerIntensity(SHAKE_ON + 3);
  });

  newRoundBtn.addEventListener("click", function(){
    roundId = Date.now();
    buildWorld();
    lastRanking = null;
    resultActions.classList.add("hidden");
    setPhase("ready");
    broadcastEvent("init", { roster: roster, roundId: roundId });
  });

  /* ============================= viewer render loop ============================= */
  function viewerLoop(){
    requestAnimationFrame(viewerLoop);
    if (role === "controller") return;
    if (curSnap){
      var frac = prevSnap ? Math.min(1, (performance.now() - curSnap.t) / TICK_MS) : 1;
      balls = curSnap.b.map(function(cur, i){
        var prev = prevSnap && prevSnap.b[i] ? prevSnap.b[i] : cur;
        var x = prev[0] + (cur[0]-prev[0]) * frac;
        var y = prev[1] + (cur[1]-prev[1]) * frac;
        var z = prev[2] + (cur[2]-prev[2]) * frac;
        return { x:x, y:y, z:z, color: colorFor(i), textColor: textColorFor(i), label: labelFor(roster[i]||"") };
      });
    }
    render3D();
    drawDebugGraph();
    drawAngleGraph();
  }

  /* ============================= phase / result UI ============================= */
  function setPhase(p, fromRemote){
    phase = p;
    phaseReadout.textContent = PHASE_LABEL[p] || p;
    if (role === "controller"){
      reshuffleBtn.disabled = (p === "shaking");
      newRoundBtn.disabled = false;
    }
    dotController.classList.toggle("shake", p === "shaking");
  }

  function showResult(ranking, animate){
    resultPanelState.textContent = "완료";
    resultActions.classList.remove("hidden");
    resultList.innerHTML = "";
    var nameToIndex = {};
    roster.forEach(function(nm,i){ nameToIndex[nm] = i; });
    ranking.forEach(function(name, idx){
      var row = document.createElement("div");
      row.className = "result-row";
      if (animate) row.style.animationDelay = (idx * 45) + "ms";
      var rk = document.createElement("span"); rk.className = "rk"; rk.textContent = (idx+1) + "위";
      var sw = document.createElement("span"); sw.className = "swatch";
      sw.style.background = colorFor(nameToIndex[name] != null ? nameToIndex[name] : idx, roster.length);
      var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = name;
      row.appendChild(rk); row.appendChild(sw); row.appendChild(nm);
      resultList.appendChild(row);
    });
  }

  copyResultBtn.addEventListener("click", function(){
    if (!lastRanking && resultList.children.length === 0) return;
    var lines = Array.prototype.map.call(resultList.querySelectorAll(".result-row"), function(row){
      return row.querySelector(".rk").textContent + " " + row.querySelector(".nm").textContent;
    });
    var text = lines.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        copyResultBtn.textContent = "복사됨!";
        setTimeout(function(){ copyResultBtn.textContent = "순위 복사"; }, 1400);
      }).catch(function(){});
    }
  });

  /* ============================= boot ============================= */
  updateRosterCount();
  requestAnimationFrame(controllerLoop);
  requestAnimationFrame(viewerLoop);
})();
</script>
</body>
</html>
